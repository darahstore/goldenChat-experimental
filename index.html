<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>goldenChat</title>
    
    <!-- المكتبات الخارجية (بدون async لتجنب أخطاء التحميل المبكر) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
    
    <!-- الثيم الأساسي -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' },
                        dark: { 800: '#1F2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>
    
    <!-- 🔗 ربط ملف التصميم -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-screen w-screen flex flex-col relative select-none bg-dark-900">

    <!-- شاشة اختيار اللغة -->
    <div id="language-view" class="flex flex-col items-center justify-center w-full h-full p-6 absolute z-50 bg-dark-900">
        <i class="ph-fill ph-crown text-gold-500 text-7xl mb-4 animate-bounce"></i>
        <h1 class="text-4xl font-bold text-gold-400 mb-8 tracking-wide">goldenChat</h1>
        <div class="space-y-4 w-full max-w-xs">
            <button onclick="setLanguage('ar'); showView('auth-view');" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3.5 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold shadow-lg">العربية</button>
            <button onclick="setLanguage('en'); showView('auth-view');" class="w-full bg-dark-800 border border-gold-500 text-gold-400 p-3.5 rounded-xl hover:bg-gold-500 hover:text-dark-900 transition font-bold shadow-lg">English</button>
        </div>
        <button id="btn-continue" class="hidden">متابعة</button>
    </div>

    <!-- شاشة المصادقة -->
    <div id="auth-view" class="hidden-view flex flex-col items-center justify-center w-full h-full p-6 max-w-md mx-auto absolute z-40 bg-dark-900">
        <div class="w-full glass-panel p-6 rounded-2xl shadow-xl shadow-gold-500/10">
            <div class="flex justify-around border-b border-gray-700 mb-6 pb-2">
                <button id="tab-login-btn" class="tab-active text-lg pb-2 transition-all">تسجيل الدخول</button>
                <button id="tab-signup-btn" class="tab-inactive text-lg pb-2 transition-all">إنشاء حساب</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label id="lbl-email" class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email-input" placeholder="mail@example.com" class="w-full bg-dark-900 border border-gray-700 p-3 rounded-xl outline-none focus:border-gold-500 text-white" dir="ltr">
                </div>
                <div>
                    <label id="lbl-pass" class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" id="password-input" placeholder="••••••••" class="w-full bg-dark-900 border border-gray-700 p-3 rounded-xl outline-none focus:border-gold-500 text-white" dir="ltr">
                </div>
                <div id="phone-field-wrapper" style="display:none;">
                    <label id="lbl-phone" class="block text-xs text-gray-400 mb-1">رقم الهاتف (+)</label>
                    <input type="tel" id="phone-input" placeholder="+212600000000" class="w-full bg-dark-900 border border-gray-700 p-3 rounded-xl outline-none focus:border-gold-500 text-white" dir="ltr">
                </div>
                <button id="btn-submit-auth" disabled class="w-full bg-gray-600 text-gray-400 p-3.5 rounded-xl font-bold transition shadow-md">تسجيل الدخول</button>
            </div>
        </div>
    </div>

    <!-- شاشة التطبيق الرئيسية (تم تغيير ID ليتطابق مع chat.js) -->
    <div id="main-chat-view" class="hidden-view flex flex-col w-full h-full absolute z-30 bg-dark-900">
        <header class="flex justify-between items-center p-4 glass-panel border-b-0 shadow-md">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-crown text-gold-500 text-2xl"></i>
                <span class="font-bold text-gold-400 text-lg">goldenChat</span>
            </div>
            <div class="flex items-center gap-3">
                <!-- أزرار الاتصال مربوطة في main.js عبر المعرفات -->
                <button id="btn-call-audio" class="p-2 bg-dark-800 rounded-full text-gold-400 hover:bg-gold-500 hover:text-dark-900 transition"><i class="ph ph-phone text-lg"></i></button>
                <button id="btn-call-video" class="p-2 bg-dark-800 rounded-full text-gold-400 hover:bg-gold-500 hover:text-dark-900 transition"><i class="ph ph-video-camera text-lg"></i></button>
                <button onclick="toggleSettings()" class="p-2 bg-dark-800 rounded-full text-gray-300 hover:text-white transition"><i class="ph ph-gear text-lg"></i></button>
            </div>
        </header>

        <!-- حاوية المكالمة (تم ترتيبها للعمل مع calls.js) -->
        <div id="call-container" class="hidden-view w-full bg-dark-800 flex flex-col relative z-20 border-b border-gray-700">
            <div id="video-streams" class="w-full max-h-60 overflow-y-auto p-2 flex gap-2"></div>
            <div class="p-3 flex justify-center items-center gap-6 bg-dark-900">
                <button id="btn-toggle-mic" class="p-3 bg-gray-700 rounded-full text-white"><i class="ph ph-microphone text-xl"></i></button>
                <button id="btn-end-call" class="p-3 bg-red-600 rounded-full text-white"><i class="ph ph-phone-disconnect text-xl"></i></button>
                <button id="btn-toggle-cam" class="p-3 bg-gray-700 rounded-full text-white"><i class="ph ph-camera text-xl"></i></button>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-messages">
            <div class="text-center text-gray-500 text-sm my-8">مرحباً بك في المحادثة!</div>
        </main>

        <footer class="p-3 glass-panel border-t-0 flex items-center gap-2">
            <!-- أزرار رفع الملفات مربوطة في main.js -->
            <label class="p-2 bg-dark-800 rounded-xl text-gold-400 cursor-pointer hover:bg-dark-900 transition border border-gray-700" title="صورة">
                <i class="ph ph-image text-xl"></i>
                <input type="file" id="upload-img" class="hidden" accept="image/*">
            </label>
            <label class="p-2 bg-dark-800 rounded-xl text-gold-400 cursor-pointer hover:bg-dark-900 transition border border-gray-700" title="فيديو">
                <i class="ph ph-video-camera text-xl"></i>
                <input type="file" id="upload-vid" class="hidden" accept="video/*">
            </label>
            
            <input type="text" id="msg-input" placeholder="اكتب رسالة..." class="flex-1 bg-dark-900 border border-gray-700 p-3 rounded-xl outline-none focus:border-gold-500 text-white">
            <button id="btn-send" class="p-3 bg-gold-500 text-dark-900 rounded-xl font-bold hover:bg-gold-400 transition shadow-md">
                <i class="ph-fill ph-paper-plane-right text-xl"></i>
            </button>
        </footer>
    </div>

    <!-- شاشة الإعدادات (تم تحويلها لقائمة جانبية منزلقة كما تمت برمجتها في main.js) -->
    <div id="settings-panel" class="fixed top-0 right-0 w-full md:w-80 h-full bg-dark-900 z-50 transform translate-x-full transition-transform duration-300 p-4 shadow-2xl border-l border-gray-800">
        <header class="flex items-center mb-6 pb-4 border-b border-gray-800">
            <button onclick="closeSettings()" class="p-2 bg-dark-800 rounded-full text-white ml-3"><i class="ph ph-arrow-right text-lg"></i></button>
            <h2 class="text-xl font-bold text-gold-400">الإعدادات</h2>
        </header>

        <button id="btn-logout" class="w-full bg-red-600/20 border border-red-600 text-red-500 p-4 rounded-xl font-bold hover:bg-red-600 hover:text-white transition mt-4 mb-6">
            تسجيل الخروج
        </button>
    </div>

    <!-- 🔗 استدعاء ملفات البرمجة (الترتيب هنا سليم جداً ومهم) -->
    <script src="config.js"></script>
    <script src="languages.js"></script>
    <script src="auth.js"></script>
    <script src="chat.js"></script>
    <script src="calls.js"></script>
    <script src="main.js"></script>
</body>
</html>
